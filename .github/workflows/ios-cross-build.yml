name: iOS 26 build and regression

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture-runtime:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Execute the real photo delegate with controlled callback order
        run: python3 tests/test_capture_pipeline.py
      - name: Upload native capture regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MarkCam-capture-runtime-${{ github.sha }}
          path: dist/capture-pipeline-regression-report.json
          if-no-files-found: error
          retention-days: 30

  ui-review:
    strategy:
      fail-fast: false
      matrix:
        ios: ['26', '18']
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      REVIEW_IOS_MAJOR: ${{ matrix.ios }}
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise native UIKit on standard and compact iPhone Simulators
        run: python3 tests/run_ui_review.py
      - name: Upload Simulator screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MarkCam-ui-evidence-${{ matrix.ios }}-${{ github.sha }}
          path: dist/ui-review/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload UIKit regression summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MarkCam-ui-runtime-${{ matrix.ios }}-${{ github.sha }}
          path: dist/ui-regression-report.json
          if-no-files-found: error
          retention-days: 30

  build:
    needs: [capture-runtime, ui-review]
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      PYTHONUTF8: '1'
    steps:
      - name: Check out the source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select and verify Apple's iOS 26 toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          python3 -m venv /tmp/markcam-python
          /tmp/markcam-python/bin/pip install Pillow==11.3.0
          echo /tmp/markcam-python/bin >> "$GITHUB_PATH"

      - name: Build and package the arm64 IPA with the iOS 26 SDK
        run: python3 scripts/build.py

      - name: Run every regression and validate the IPA
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess, sys
          tests = sorted(p for p in pathlib.Path('tests').glob('test_*.py') if p.name != 'test_capture_pipeline.py')
          assert tests, 'No regression scripts found'
          results = []
          for test in [*tests, pathlib.Path('scripts/validate.py')]:
              print(f'::group::{test}', flush=True)
              result = subprocess.run([sys.executable, str(test)])
              results.append({'script': str(test), 'exit_code': result.returncode})
              print('::endgroup::', flush=True)
          failed = [r for r in results if r['exit_code'] != 0]
          report = {'status': 'failed' if failed else 'passed',
                    'scope': 'Apple iOS 26 SDK compilation, host C tests, source contracts and IPA validation; no physical iPhone tests',
                    'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                    'device_tested': False, 'scripts': results}
          pathlib.Path('dist/test-status.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          sys.exit(bool(failed))
          PY

      - name: Include the successful native capture report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MarkCam-capture-runtime-${{ github.sha }}
          path: dist/

      - name: Include the successful UIKit Simulator report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MarkCam-ui-runtime-26-${{ github.sha }}
          path: dist/

      - name: Include the successful older-iOS fallback report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MarkCam-ui-runtime-18-${{ github.sha }}
          path: /tmp/markcam-fallback/
      - name: Retain fallback evidence separately
        run: cp /tmp/markcam-fallback/ui-regression-report.json dist/ui-fallback-regression-report.json

      - name: Generate source archive and delivery checksums
        run: |
          python3 tests/render_layout_review.py
          cp tests/layout-fixtures.json dist/layout-fixtures.json
          cp docs/layout-review.html dist/layout-review.html
          # These two tracked files are historical generated previews. Retain
          # this run's output as artifacts, and archive the exact source commit.
          git restore --source=HEAD -- tests/layout-fixtures.json docs/layout-review.html
          python3 scripts/publish-local.py
          cd dist
          shasum -a 256 --check SHA256SUMS.txt

      - name: Upload verified IPA, source and reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MarkCam-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics for a failed build
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MarkCam-failed-checks-${{ github.sha }}
          path: dist/*.json
          if-no-files-found: ignore
          retention-days: 14
